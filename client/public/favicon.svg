  <line x1="18" y1="4" x2="18" y2="48" stroke="#52B788" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="46" y1="4" x2="46" y2="48" stroke="#52B788" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- Centered Gold Star Badge -->
  <polygon points="32,15 35.5,23 44,24 37.8,29.8 39.5,38 32,33.5 24.5,38 26.2,29.8 20,24 28.5,23" 
           fill="url(#starGrad)" stroke="#B45309" stroke-width="0.75" filter="url(#glow)"/>
</svg>