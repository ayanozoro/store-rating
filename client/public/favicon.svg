<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#0F281E" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Ribbon Body with Notched Bottom -->
  <path d="M14 6 C14 4.5 15.5 3 17 3 L47 3 C48.5 3 50 4.5 50 6 L50 59 C50 60.5 48.2 61.4 47 60.4 L32 48 L17 60.4 C15.8 61.4 14 60.5 14 59 Z" 
